buffers: {
  size_kb: 65536
  fill_policy: RING_BUFFER
}
data_sources: {
  config {
    name: "android.heapprofd"
    target_buffer: 0
    heapprofd_config {
      sampling_interval_bytes: 65536
      shmem_size_bytes: 8388608
      process_cmdline: "com.anonymous.quranappmobile"
      all_heaps: true
      continuous_dump_config {
        dump_phase_ms: 20000
        dump_interval_ms: 10000
      }
    }
  }
}
duration_ms: 35000
